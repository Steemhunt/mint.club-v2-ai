name: Dependency audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run audit:full
        env:
          AUDIT_REPORT_PATH: full-audit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-dependency-audit
          path: full-audit.json
          if-no-files-found: warn
