name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality + Node 18 package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- cli/THIRD_PARTY_NOTICES.md mcp/THIRD_PARTY_NOTICES.md
      - run: npm run audit:production
      - run: npm run audit:full
      - run: npm run test:release
      - run: mkdir -p "$RUNNER_TEMP/mintclub-packs"
      - run: npm pack --ignore-scripts --workspace cli --pack-destination "$RUNNER_TEMP/mintclub-packs"
      - run: npm pack --ignore-scripts --workspace mcp --pack-destination "$RUNNER_TEMP/mintclub-packs"
      - uses: actions/setup-node@v7
        with:
          node-version: 18.20.8
      - name: Smoke-test packed CLI and MCP
        run: |
          mkdir -p "$RUNNER_TEMP/mintclub-node18"
          cd "$RUNNER_TEMP/mintclub-node18"
          npm init -y
          npm install "$RUNNER_TEMP"/mintclub-packs/mint.club-v2-cli-*.tgz "$RUNNER_TEMP"/mintclub-packs/mint.club-v2-mcp-*.tgz
          ./node_modules/.bin/mc --version
          SMITHERY_SCAN=1 node --input-type=module --eval "await import('@mint.club/v2-mcp')"

  integration:
    name: Read-only integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run test:integration
